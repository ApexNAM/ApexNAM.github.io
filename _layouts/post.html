<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: site.description }}">

    <!-- Open Graph -->
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.excerpt | default: site.description }}">
    <meta property="og:image" content="{{ site.url }}{{ page.og_image | default: site.default_og_image }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">

    <!-- Twitter (X) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ site.url }}{{ page.url }}">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.excerpt | default: site.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ page.og_image | default: site.default_og_image }}">

    <link href="{{ '/assets/css/post.css' | relative_url }}" rel="stylesheet">
    <link rel="icon" href="/skagogames.ico" type="image/x-icon">

    <!-- MathJax — $...$ 인라인, $$...$$ 블럭 수식 지원 -->
    <script>
      MathJax = {
        tex: {
          inlineMath:  [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          processEscapes: true,
          processEnvironments: true
        },
        options: {
          skipHtmlTags: ['script','noscript','style','textarea','pre','code']
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  </head>

  <body>

    <header class="post-header">
      <a href="{{ site.baseurl }}/">
        <img src="{{ site.baseurl }}/srcs/logos/SkagoGames_NewLogo_2026_W.png" alt="SkagoGames 로고" class="logo">
      </a>
      <h1 class="post-header__title">{{ page.title }}</h1>
      {% if page.date %}
        <p class="post-header__date">{{ page.date | date: "%Y-%m-%d" }}</p>
      {% endif %}
    </header>

    <main>
      <div class="markdown-body">
        {{ content }}
      </div>
    </main>

    <footer class="post-footer">
      <p class="footer-text">SkagoGames. made in Skago.</p>
    </footer>

    <!-- Obsidian 내부 링크 변환용: Jekyll이 아는 실제 포스트 주소 목록 -->
    <script>
      window.__POSTS__ = [
        {%- for p in site.posts %}
        { "path": {{ p.path | jsonify }}, "url": {{ p.url | relative_url | jsonify }}, "title": {{ p.title | jsonify }} }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ];
    </script>

    <script>
    (function () {

      /* ── Obsidian 내부 링크(.md, [[위키링크]]) → 실제 포스트 주소 ── */
      var POST_MAP = {};
      (function () {
        function put(key, url) {
          if (!key) return;
          key = String(key).trim().toLowerCase();
          if (key && !(key in POST_MAP)) POST_MAP[key] = url;
        }
        (window.__POSTS__ || []).forEach(function (p) {
          var base = String(p.path || '').split('/').pop().replace(/\.md$/i, '');
          put(base, p.url);                                    /* 2026-07-16-제목 */
          put(base.replace(/^\d{4}-\d{2}-\d{2}-/, ''), p.url); /* 날짜 뺀 파일명 */
          put(p.title, p.url);                                 /* 글 제목 */
        });
      }());

      /* kramdown이 헤딩에 붙이는 id 규칙과 동일하게 (공백 → -) */
      function slugify(s) {
        return String(s).trim().toLowerCase()
          .replace(/[.,!?'"“”‘’()[\]{}]/g, '')
          .replace(/\s+/g, '-');
      }

      /* 문서명(경로·확장자·앵커 포함 가능) → 실제 주소. 못 찾으면 null */
      function lookupPost(target) {
        if (!target) return null;
        var t = String(target).trim();
        try { t = decodeURIComponent(t); } catch (e) {}
        t = t.replace(/\\/g, '/').split('#')[0].split('?')[0];
        t = t.split('/').pop().replace(/\.md$/i, '').trim();
        if (!t) return null;
        return POST_MAP[t.toLowerCase()] || null;
      }

      /* 주소로 글 제목 찾기 */
      function postTitle(url) {
        var hit = (window.__POSTS__ || []).filter(function (p) { return p.url === url; })[0];
        return hit && hit.title ? hit.title : '';
      }

      /* 이미 <a>로 만들어진 .md 링크 고치기 */
      (function () {
        var root = document.querySelector('.markdown-body');
        if (!root) return;

        root.querySelectorAll('a[href]').forEach(function (a) {
          var href = a.getAttribute('href') || '';
          /* 외부 링크·앵커·절대경로는 건드리지 않음 */
          if (/^(?:[a-z][a-z0-9+.-]*:|\/\/|#)/i.test(href)) return;
          if (!/\.md(?:[#?][^]*)?$/i.test(href)) return;

          var url = lookupPost(href);
          if (!url) return;   /* 비공개(draft) 글 등은 그대로 둠 */

          var hashMatch = href.match(/#([^?]*)$/);
          a.setAttribute('href', url + (hashMatch ? '#' + slugify(hashMatch[1]) : ''));

          /* 링크 글자가 파일명 그대로면 글 제목으로 바꿔줌 */
          var txt  = a.textContent.trim();
          var file = decodeURIComponent(href).split('/').pop().replace(/\.md$/i, '');
          if (txt === file || txt === file.replace(/^\d{4}-\d{2}-\d{2}-/, '')) {
            var hit = (window.__POSTS__ || []).filter(function (p) { return p.url === url; })[0];
            if (hit && hit.title) a.textContent = hit.title;
          }
        });
      }());

      /* ── Obsidian 호환: 이미지 경로·위키링크·URL 자동 보정 ── */
      (function () {
        var root = document.querySelector('.markdown-body');
        if (!root) return;

        var IMG_DIR = '/srcs/imgs/post_imgs/';

        /* 1) 상대 경로 이미지 → 사이트 루트 기준 절대 경로 */
        root.querySelectorAll('img').forEach(function (img) {
          var src = img.getAttribute('src') || '';
          if (src && src.charAt(0) !== '/' &&
              !/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(src)) {
            img.setAttribute('src', '/' + src);
          }
        });

        /* 2) 텍스트로 남은 ![[파일.png]] 임베드와 맨 URL 처리 */
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: function (n) {
            var p = n.parentNode;
            while (p && p !== root) {
              var t = p.nodeName;
              if (t === 'A' || t === 'CODE' || t === 'PRE' ||
                  t === 'SCRIPT' || t === 'STYLE') return NodeFilter.FILTER_REJECT;
              p = p.parentNode;
            }
            return NodeFilter.FILTER_ACCEPT;
          }
        });
        var textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);

        var pattern = /!\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]|\[\[([^\]|]+?)(?:\|([^\]]*))?\]\]|https?:\/\/[A-Za-z0-9\-._~:/?#@!$&'()*+,;=%]+/g;

        textNodes.forEach(function (node) {
          var text = node.nodeValue;
          if (!/\[\[|https?:\/\//.test(text)) return;

          var frag = document.createDocumentFragment();
          var last = 0, m;
          pattern.lastIndex = 0;

          while ((m = pattern.exec(text))) {
            frag.appendChild(document.createTextNode(text.slice(last, m.index)));
            last = pattern.lastIndex;

            if (m[0].charAt(0) === '!') {
              /* ![[파일.png]] 또는 ![[파일.png|400]] → <img> */
              var target = m[1].trim();
              var opt    = (m[2] || '').trim();
              var src    = target.indexOf('/') !== -1 ? target : IMG_DIR + target;
              if (src.charAt(0) !== '/') src = '/' + src;

              var img = document.createElement('img');
              img.src = encodeURI(src);
              img.alt = /^\d+$/.test(opt) || !opt ? target : opt;
              /* 지정 폭이 화면보다 크면 화면 폭에 맞춤 */
              img.style.maxWidth = /^\d+$/.test(opt)
                ? 'min(' + opt + 'px, 100%)' : 'min(600px, 100%)';
              img.style.height = 'auto';
              frag.appendChild(img);
            } else if (m[0].charAt(0) === '[') {
              /* [[문서]] · [[문서|표시글]] · [[문서#헤딩]] → 포스트 링크 */
              var raw   = m[3].trim();
              var label = (m[4] || '').trim();
              var parts = raw.split('#');
              var docName = parts[0].trim();
              var heading = parts.length > 1 ? parts.slice(1).join('#').trim() : '';
              var postUrl = docName ? lookupPost(docName) : '';

              if (!docName && heading) {
                /* [[#헤딩]] — 같은 글 안의 위치 */
                postUrl = '';
              }

              /* 표시글을 안 줬으면 파일명 대신 글 제목을 보여줌 */
              var shown = label;
              if (!shown) {
                var t = postUrl ? postTitle(postUrl) : '';
                shown = (t || docName) + (heading ? ' › ' + heading : '');
              }

              if (postUrl || (!docName && heading)) {
                var link = document.createElement('a');
                link.href = (postUrl || '') + (heading ? '#' + slugify(heading) : '');
                link.textContent = shown;
                frag.appendChild(link);
              } else {
                /* 아직 공개되지 않은 글 등 못 찾은 링크는 글자만 남김 */
                frag.appendChild(document.createTextNode(shown));
              }
            } else {
              /* 맨 URL → 클릭 가능한 링크 (끝에 붙은 문장부호는 제외) */
              var url = m[0], trail = '';
              while (/[.,;:!?'"”’]$/.test(url) ||
                     (url.slice(-1) === ')' && url.indexOf('(') === -1)) {
                trail = url.slice(-1) + trail;
                url = url.slice(0, -1);
              }
              var a = document.createElement('a');
              a.href = url;
              a.textContent = url;
              a.target = '_blank';
              a.rel = 'noopener';
              frag.appendChild(a);
              if (trail) frag.appendChild(document.createTextNode(trail));
            }
          }

          frag.appendChild(document.createTextNode(text.slice(last)));
          node.parentNode.replaceChild(frag, node);
        });
      }());

      /* ── Obsidian 파이프 표 복구 ──
         hard_wrap 때문에 kramdown이 `| a | b |` 표를 표로 인식하지 못하고
         <br>로 이어진 한 문단으로 뱉어낸다. 그 문단을 진짜 <table>로 되돌린다.
         (kramdown이 구분선 `---`을 —(em대시)로 바꿔놓으므로 함께 인식) */
      (function () {
        var SEP = /^[\s|:.\-‐-―]+$/;   /* 구분선: -, –, — 등 허용 */

        function stripTags(s) {
          var d = document.createElement('div');
          d.innerHTML = s;
          return d.textContent;
        }
        function isRow(s) {
          var t = stripTags(s).trim();
          return t.charAt(0) === '|' && t.indexOf('|', 1) !== -1;
        }
        function isSep(s) {
          var t = stripTags(s).trim();
          return isRow(s) && SEP.test(t) && /[-‐-―]/.test(t);
        }
        function cells(s) {
          var t = s.trim().replace(/^\s*\|/, '').replace(/\|\s*$/, '');
          return t.split('|');
        }

        Array.prototype.forEach.call(
          document.querySelectorAll('.markdown-body p'), function (p) {
          if (p.textContent.indexOf('|') === -1) return;
          if (p.querySelector('code, pre')) return;   /* 코드 안의 | 는 건드리지 않음 */

          var lines = p.innerHTML.split(/<br\s*\/?>/i);
          if (lines.length < 2) return;

          /* 표 줄이 연속으로 이어지는 구간 찾기 (구분선이 반드시 포함되어야 함) */
          var start = -1, end = -1;
          for (var i = 0; i < lines.length; i++) {
            if (!isRow(lines[i])) {
              if (start !== -1) break;
              continue;
            }
            if (start === -1) start = i;
            end = i;
          }
          if (start === -1) return;

          var sepIdx = -1;
          for (var j = start; j <= end; j++) {
            if (isSep(lines[j])) { sepIdx = j; break; }
          }
          /* 구분선이 없거나 맨 첫 줄이면 표가 아님 */
          if (sepIdx <= start) return;

          var table = document.createElement('table');
          var thead = document.createElement('thead');
          var tbody = document.createElement('tbody');

          for (var k = start; k <= end; k++) {
            if (k === sepIdx) continue;
            var isHead = k < sepIdx;
            var tr = document.createElement('tr');
            cells(lines[k]).forEach(function (c) {
              var cell = document.createElement(isHead ? 'th' : 'td');
              cell.innerHTML = c.trim();
              tr.appendChild(cell);
            });
            (isHead ? thead : tbody).appendChild(tr);
          }

          if (thead.children.length) table.appendChild(thead);
          if (tbody.children.length) table.appendChild(tbody);

          /* 표 앞뒤에 남은 줄은 문단으로 되살림 */
          function makeP(arr) {
            var txt = arr.join('<br>').replace(/^(?:\s|<br\s*\/?>)+|(?:\s|<br\s*\/?>)+$/gi, '');
            if (!txt) return null;
            var el = document.createElement('p');
            el.innerHTML = txt;
            return el;
          }
          var before = makeP(lines.slice(0, start));
          var after  = makeP(lines.slice(end + 1));

          var parent = p.parentNode;
          if (before) parent.insertBefore(before, p);
          parent.insertBefore(table, p);
          if (after) parent.insertBefore(after, p);
          p.remove();
        });
      }());

      /* ── 테이블: 스크롤 래퍼 + 이미지 전용 표 갤러리화 ── */
      document.querySelectorAll('.markdown-body table').forEach(function (table) {
        var wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);

        /* 모든 셀에 텍스트 없이 이미지만 있으면 갤러리 스타일 적용 */
        var cells = table.querySelectorAll('th, td');
        var textFree = Array.prototype.every.call(cells, function (c) {
          return !c.textContent.trim();
        });
        if (textFree && table.querySelector('img')) {
          table.classList.add('image-table');
          wrap.classList.add('table-wrap--image');
        }
      });

      /* ── 이미지 모바일 최적화: 지연 로딩 + Obsidian 리사이즈 문법 ── */
      document.querySelectorAll('.markdown-body img').forEach(function (img, i) {
        /* 첫 이미지는 즉시 로드(LCP), 나머지는 지연 로딩 */
        if (i > 0) img.loading = 'lazy';
        img.decoding = 'async';

        /* ![alt|400](경로) — alt 뒤에 붙는 Obsidian 폭 지정 처리 */
        var alt = img.getAttribute('alt') || '';
        var m = alt.match(/^(.*)\|(\d+)\s*$/);
        if (m) {
          img.setAttribute('alt', m[1].trim());
          img.style.maxWidth = 'min(' + m[2] + 'px, 100%)';
          img.style.height = 'auto';
        }

        /* width 속성이 화면 폭을 넘지 않게 클램프 (잘림 방지) */
        var w = img.getAttribute('width');
        if (w && /^\d+$/.test(w)) {
          img.removeAttribute('width');
          img.removeAttribute('height');
          img.style.maxWidth = 'min(' + w + 'px, 100%)';
          img.style.height = 'auto';
        }

        /* 고정 px 인라인 스타일(kramdown IAL `{: style="max-width:600px" }` 등)은
           인라인이라 스타일시트를 이겨서 좁은 화면에서 사진이 잘림
           → min(지정폭, 100%)으로 바꿔 화면 폭을 절대 넘지 않게 함 */
        var mw = img.style.maxWidth;
        if (mw && mw.indexOf('min(') === -1 && /^\d+(\.\d+)?px$/.test(mw.trim())) {
          img.style.maxWidth = 'min(' + mw.trim() + ', 100%)';
        }
        if (/^\d+(\.\d+)?px$/.test((img.style.width || '').trim())) {
          img.style.maxWidth = 'min(' + img.style.width.trim() + ', 100%)';
          img.style.width = 'auto';
        }
      });

      /* ── 콜아웃 변환 (Obsidian > [!TYPE] → styled callout) ── */
      var typeMap = {
        note:      { icon: 'ℹ️',  label: 'NOTE',      color: 'note'      },
        info:      { icon: 'ℹ️',  label: 'INFO',      color: 'note'      },
        abstract:  { icon: '📋', label: 'ABSTRACT',  color: 'note'      },
        summary:   { icon: '📋', label: 'SUMMARY',   color: 'note'      },
        tldr:      { icon: '📋', label: 'TL;DR',     color: 'note'      },
        tip:       { icon: '💡', label: 'TIP',       color: 'tip'       },
        hint:      { icon: '💡', label: 'HINT',      color: 'tip'       },
        important: { icon: '🔷', label: 'IMPORTANT', color: 'important' },
        warning:   { icon: '⚠️', label: 'WARNING',   color: 'warning'   },
        caution:   { icon: '⚠️', label: 'CAUTION',   color: 'warning'   },
        attention: { icon: '⚠️', label: 'ATTENTION', color: 'warning'   },
        danger:    { icon: '🔴', label: 'DANGER',    color: 'danger'    },
        error:     { icon: '🔴', label: 'ERROR',     color: 'danger'    },
        bug:       { icon: '🐛', label: 'BUG',       color: 'danger'    },
        failure:   { icon: '❌', label: 'FAILURE',   color: 'danger'    },
        fail:      { icon: '❌', label: 'FAIL',      color: 'danger'    },
        missing:   { icon: '❌', label: 'MISSING',   color: 'danger'    },
        success:   { icon: '✅', label: 'SUCCESS',   color: 'success'   },
        check:     { icon: '✅', label: 'CHECK',     color: 'success'   },
        done:      { icon: '✅', label: 'DONE',      color: 'success'   },
        question:  { icon: '❓', label: 'QUESTION',  color: 'question'  },
        help:      { icon: '❓', label: 'HELP',      color: 'question'  },
        faq:       { icon: '❓', label: 'FAQ',       color: 'question'  },
        example:   { icon: '🔍', label: 'EXAMPLE',   color: 'example'   },
        quote:     { icon: '💬', label: 'QUOTE',     color: 'quote'     },
        cite:      { icon: '💬', label: 'CITE',      color: 'quote'     }
      };

      document.querySelectorAll('.markdown-body blockquote').forEach(function (bq) {
        var firstP = bq.querySelector('p:first-child');
        if (!firstP) return;

        /* 첫 줄(<br> 이전)만 떼어 [!...] 헤더인지 검사
           — hard_wrap 때문에 제목과 본문이 한 <p>에 섞여 들어옴 */
        var nodes   = Array.prototype.slice.call(firstP.childNodes);
        var brIdx   = -1;
        for (var i = 0; i < nodes.length; i++) {
          if (nodes[i].nodeName === 'BR') { brIdx = i; break; }
        }
        var headNodes = brIdx === -1 ? nodes : nodes.slice(0, brIdx);
        var restNodes = brIdx === -1 ? []    : nodes.slice(brIdx + 1);
        var headText  = headNodes.map(function (n) { return n.textContent; })
                                 .join('').trim();

        /* [!TYPE], [!TYPE]-, [!TYPE] 제목, [!한글 문구도 OK] 패턴 매칭 */
        var m = headText.match(/^\[!([^\]\n]+)\]([+\-]?)[ \t]*([\s\S]*)$/);
        if (!m) return;

        var typeKey = m[1].trim().toLowerCase();
        var mode    = m[2];              /* '+' 펼침 | '-' 접힘 | '' 고정 */
        var cTitle  = (m[3] || '').trim();

        /* 모르는 타입은 Obsidian처럼 ✏️ 아이콘 + 괄호 안 문구를 제목으로 */
        var info  = typeMap[typeKey] || { icon: '✏️', label: m[1].trim(), color: 'note' };
        var label = (cTitle || info.label)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        bq.classList.add('callout', 'callout-' + info.color);

        /* 본문 노드 수집: 첫 <p>에서 헤더 뒤에 남은 줄 + 나머지 형제 요소 */
        var bodyFrag = document.createDocumentFragment();
        if (restNodes.length) {
          var restP = document.createElement('p');
          restNodes.forEach(function (n) { restP.appendChild(n); });
          bodyFrag.appendChild(restP);
        }
        Array.from(bq.children).slice(1).forEach(function (c) { bodyFrag.appendChild(c); });
        var bodyDiv = document.createElement('div');
        bodyDiv.className = 'callout-body';
        bodyDiv.appendChild(bodyFrag);

        firstP.remove();
        bq.innerHTML = '';

        var titleHTML = '<span class="callout-icon">' + info.icon + '</span>'
                      + '<span class="callout-label">' + label + '</span>';

        if (mode === '+' || mode === '-') {
          /* 접기/펼치기 */
          var details = document.createElement('details');
          if (mode !== '-') details.open = true;

          var summary = document.createElement('summary');
          var titleDiv = document.createElement('div');
          titleDiv.className = 'callout-title';
          titleDiv.innerHTML = titleHTML + '<span class="callout-fold">&#9654;</span>';
          summary.appendChild(titleDiv);

          details.appendChild(summary);
          details.appendChild(bodyDiv);
          bq.appendChild(details);
        } else {
          /* 고정 */
          var titleDiv2 = document.createElement('div');
          titleDiv2.className = 'callout-title';
          titleDiv2.innerHTML = titleHTML;
          bq.appendChild(titleDiv2);
          bq.appendChild(bodyDiv);
        }
      });

      /* ── 각주 툴팁 ── */
      (function () {
        var tip = null;
        var hideTimer = null;

        function buildTip(anchor) {
          var id = (anchor.getAttribute('href') || '').replace('#', '');
          var fnEl = document.getElementById(id);
          if (!fnEl) return null;

          var clone = fnEl.cloneNode(true);
          var back = clone.querySelector('.reversefootnote');
          if (back) back.remove();

          var el = document.createElement('div');
          el.className = 'fn-tooltip';
          el.innerHTML = clone.innerHTML.trim();
          document.body.appendChild(el);
          return el;
        }

        function placeTip(el, anchor) {
          var ar = anchor.getBoundingClientRect();
          var tr = el.getBoundingClientRect();
          var gap = 7;
          var top = ar.top - tr.height - gap;
          if (top < 8) top = ar.bottom + gap;
          var left = ar.left + ar.width / 2 - tr.width / 2;
          left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
          el.style.top  = top  + 'px';
          el.style.left = left + 'px';
        }

        document.querySelectorAll('.markdown-body a.footnote').forEach(function (a) {
          a.addEventListener('mouseenter', function () {
            clearTimeout(hideTimer);
            if (tip) { tip.remove(); tip = null; }
            tip = buildTip(a);
            if (!tip) return;
            placeTip(tip, a);
            requestAnimationFrame(function () { tip && tip.classList.add('fn-tooltip--visible'); });
          });
          a.addEventListener('mouseleave', function () {
            hideTimer = setTimeout(function () {
              if (tip) {
                tip.classList.remove('fn-tooltip--visible');
                setTimeout(function () { if (tip) { tip.remove(); tip = null; } }, 150);
              }
            }, 80);
          });
        });
      }());

      /* ── Mermaid 차트 (Obsidian ```mermaid 블럭) ── */
      (function () {
        var els = document.querySelectorAll('.markdown-body [class*="language-mermaid"]');
        if (!els.length) return;

        /* Rouge 래퍼(div.highlighter-rouge) 전체를 mermaid 컨테이너로 교체 */
        var seen = [];
        els.forEach(function (el) {
          var box = el.closest('div.highlighter-rouge') || el.closest('pre') || el;
          if (seen.indexOf(box) !== -1) return;
          seen.push(box);

          var code = box.querySelector('code') || box;
          var pre = document.createElement('pre');
          pre.className = 'mermaid';
          pre.textContent = code.textContent;
          box.parentNode.replaceChild(pre, box);
        });

        /* 차트가 있는 글에서만 라이브러리 로드 */
        import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
          .then(function (mod) {
            var mermaid = mod.default;
            mermaid.initialize({
              startOnLoad: false,
              theme: 'dark',
              themeVariables: {
                fontFamily: "'Pretendard', sans-serif",
                darkMode: true
              }
            });
            return mermaid.run({ querySelector: '.mermaid' });
          })
          .catch(function (e) {
            console.warn('mermaid 로드 실패:', e);
          });
      }());

      /* ── 코드 블럭 언어 레이블 ── */
      document.querySelectorAll('.markdown-body [class*="language-"]').forEach(function (wrapper) {
        var highlight = wrapper.querySelector('.highlight');
        if (!highlight) return;

        var langClass = Array.from(wrapper.classList).find(function (c) {
          return c.startsWith('language-') && !c.includes('highlighter');
        });
        if (!langClass) return;

        var lang = langClass.replace('language-', '').trim();
        if (!lang) return;

        var lbl = document.createElement('span');
        lbl.className = 'code-lang';
        lbl.textContent = lang;
        highlight.appendChild(lbl);
      });

    })();
    </script>

  </body>
</html>
